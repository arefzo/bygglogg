services:
  - type: web
    name: bygglogg
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: aref@incon.se
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
